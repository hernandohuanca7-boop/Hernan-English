<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power English - Pasado Simple</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4">

    <!-- Header: Vidas, Progreso y Salida -->
    <header class="max-w-md mx-auto w-full flex items-center justify-between mb-4">
        <button onclick="alert('¿Salir de la lección?')" class="text-slate-400 hover:text-white text-lg">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <!-- Barra de Progreso -->
        <div class="flex-1 mx-4 bg-slate-800 h-3 rounded-full overflow-hidden border border-slate-700">
            <div id="progress-bar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 25%;"></div>
        </div>
        <!-- Vidas (Corazones) -->
        <div class="text-red-500 font-bold flex gap-1 text-sm">
            ❤️ <span id="lives-count">5</span>
        </div>
    </header>

    <!-- Contenedor Principal de la Lección -->
    <main class="max-w-md mx-auto w-full flex-1 flex flex-col justify-center">

        <!-- Sección de Teoría / Video Corto Opcional -->
        <div id="theory-section" class="bg-slate-800 border border-slate-700 rounded-2xl p-4 mb-6 hidden">
            <h3 class="text-sm font-semibold text-blue-400 mb-2"><i class="fa-brands fa-youtube text-red-500"></i> Video Explicativo (1 min)</h3>
            <div class="aspect-video w-full bg-slate-900 rounded-lg overflow-hidden mb-3">
                <iframe class="w-full h-full" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Past Simple Intro" frameborder="0" allowfullscreen></iframe>
            </div>
            <button onclick="cerrarTeoria()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-xl text-sm font-semibold transition">¡Entendido, a practicar! 🚀</button>
        </div>

        <!-- Tarjeta de Ejercicio -->
        <div id="exercise-card" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <span class="text-xs uppercase tracking-widest text-emerald-400 font-semibold bg-emerald-950 px-3 py-1 rounded-full border border-emerald-800">Nivel 1: Past Simple</span>
            
            <h2 id="question-prompt" class="text-xl font-bold my-4 text-white">Completa con el pasado simple del verbo entre paréntesis:</h2>
            <p id="question-sentence" class="text-lg text-blue-200 mb-6 font-medium">She <span class="bg-slate-700 px-2 py-1 rounded text-white underline decoration-blue-400">_____</span> (go) to the supermarket yesterday.</p>

            <!-- Opciones de Respuesta / Input -->
            <div id="options-container" class="grid grid-cols-2 gap-3 mb-6">
                <!-- Se generan dinámicamente -->
            </div>

            <button id="check-btn" onclick="verificarRespuesta()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold transition shadow-lg shadow-emerald-900/50">
                Comprobar
            </button>
        </div>

        <!-- Feedback de Éxito / Error (Oculto al inicio) -->
        <div id="feedback-box" class="mt-4 p-4 rounded-xl hidden text-center">
            <p id="feedback-msg" class="font-bold text-lg mb-2"></p>
            <button onclick="siguientePregunta()" class="bg-white text-slate-900 font-bold px-6 py-2 rounded-xl text-sm hover:bg-slate-200 transition">Continuar</button>
        </div>

    </main>

    <script>
        // Banco de preguntas centrado en el TIEMPO PASADO SIMPLE
        const preguntas = [
            {
                prompt: "Elige el pasado simple correcto del verbo 'GO':",
                sentence: "Yesterday, I _____ to the cinema with my friends.",
                options: ["goed", "went", "gone", "going"],
                answer: "went"
            },
            {
                prompt: "¿Cómo se escribe en pasado negativo?",
                sentence: "She _____ (not play) tennis last weekend.",
                options: ["didn't played", "doesn't play", "didn't play", "not played"],
                answer: "didn't play"
            },
            {
                prompt: "Selecciona el pasado del verbo irregular 'EAT':",
                sentence: "He _____ a delicious pizza an hour ago.",
                options: ["eated", "ate", "eaten", "eat"],
                answer: "ate"
            },
            {
                prompt: "Verbo regular en pasado (añade -ed):",
                sentence: "They _____ (clean) their house on Sunday.",
                options: ["cleaned", "clean", "cleaning", "cleant"],
                answer: "cleaned"
            }
        ];

        let indiceActual = 0;
        let vidas = 5;
        let seleccionUsuario = null;

        function cargarPregunta() {
            if (indiceActual >= preguntas.length) {
                document.getElementById('exercise-card').innerHTML = `
                    <div class="text-center py-8">
                        <div class="text-6xl mb-4">🏆</div>
                        <h2 class="text-2xl font-bold text-white mb-2">¡Lección Completada!</h2>
                        <p class="text-slate-400 text-sm mb-6">Has dominado los conceptos básicos del Tiempo Pasado Simple.</p>
                        <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-bold">Repetir Lección</button>
                    </div>
                `;
                document.getElementById('feedback-box').classList.add('hidden');
                return;
            }

            const p = preguntas[indiceActual];
            document.getElementById('question-prompt').innerText = p.prompt;
            document.getElementById('question-sentence').innerHTML = p.sentence;
            
            // Actualizar barra de progreso
            const porcentaje = ((indiceActual) / preguntas.length) * 100;
            document.getElementById('progress-bar').style.width = `${porcentaje}%`;

            // Renderizar opciones de manera aleatoria o fija
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            seleccionUsuario = null;

            p.options.forEach(op => {
                const btn = document.createElement('button');
                btn.className = "bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white py-3 px-4 rounded-xl font-medium transition text-center";
                btn.innerText = op;
                btn.onclick = () => seleccionarOpcion(btn, op);
                container.appendChild(btn);
            });

            document.getElementById('feedback-box').classList.add('hidden');
            document.getElementById('check-btn').style.display = 'block';
        }

        function seleccionarOpcion(element, opcion) {
            // Quitar selección previa de los botones
            Array.from(document.getElementById('options-container').children).forEach(b => {
                b.classList.remove('bg-blue-600', 'border-blue-400', 'ring-2');
                b.classList.add('bg-slate-700');
            });
            // Marcar el actual
            element.classList.remove('bg-slate-700');
            element.classList.add('bg-blue-600', 'border-blue-400', 'ring-2', 'ring-blue-300');
            seleccionUsuario = opcion;
        }

        function verificarRespuesta() {
            if (!seleccionUsuario) {
                alert("Por favor selecciona una opción.");
                return;
            }

            const p = preguntas[indiceActual];
            const feedbackBox = document.getElementById('feedback-box');
            const feedbackMsg = document.getElementById('feedback-msg');
            const checkBtn = document.getElementById('check-btn');

            feedbackBox.classList.remove('hidden');
            checkBtn.style.display = 'none';

            if (seleccionUsuario === p.answer) {
                feedbackBox.className = "mt-4 p-4 rounded-xl text-center bg-emerald-950 border border-emerald-800 text-emerald-300";
                feedbackMsg.innerText = "¡Excelente! 🎉 Respuesta correcta.";
            } else {
                vidas--;
                document.getElementById('lives-count').innerText = vidas;
                feedbackBox.className = "mt-4 p-4 rounded-xl text-center bg-rose-950 border border-rose-800 text-rose-300";
                feedbackMsg.innerText = `Incorrecto. La respuesta era: "${p.answer}"`;
                
                if (vidas <= 0) {
                    alert("¡Te has quedado sin vidas! Vuelve a intentarlo.");
                    location.reload();
                }
            }
        }

        function siguientePregunta() {
            indiceActual++;
            cargarPregunta();
        }

        function cerrarTeoria() {
            document.getElementById('theory-section').classList.add('hidden');
        }

        // Iniciar la app cargando la primera pregunta
        cargarPregunta();
    </script>
</body>
</html>
